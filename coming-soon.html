<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">

    <title>LREA</title>
</head>

<style>
    body {
        font-family: 'Work Sans', sans-serif;
        /* background-color: #583ce1; */
        background-color: #cdecfb;
        color: #583ce1;
    }

    h1 {
        font-weight: 700;
        font-size: 3.5rem;
        font-family: 'Dela Gothic One', cursive;
    }

    p {
        font-size: 1rem;
        text-transform: uppercase;
        color: #fff;
        letter-spacing: 2px;
        line-height: 30px;
    }

    .gradient-text {
        background-image: linear-gradient(180deg, #fff, #f8481f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
    }

    .add-image {
        background: url(https://luxury-zabaione-102648.netlify.app/images/study-steer-bg.jpg);
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        height: 100vh;
    }

    .overlay-hero {
        background-image: linear-gradient(#70240440, #270902);
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
    }

    @media screen and (max-width: 768px) {
        h1 {
            font-weight: 700;
            font-size: 2.5rem;
            font-family: 'Dela Gothic One', cursive;
        }

        p {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #fff;
            letter-spacing: 2px;
            line-height: 25px;
        }
    }
</style>

<body>
    <div class="box-grid-container add-image position-relative">

        <div class="overlay-hero"></div>

        <div class="grid-content d-flex align-items-lg-center align-items-end justify-content-center h-100 py-5 px-2">

            <div class="container position-relative">
                <div class="row">
                    <div class="col-lg-6 mx-auto text-center">

                        <!-- <img src="" class="img-fluid d-block mx-auto mb-5"
                            style="height: 60px;" /> -->

                        <p class="mb-0">Our website is</p>
                        <h1 class="gradient-text">Under Construction</h1>

                        <p>Currently we are working on our new website. We will be back soon.</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
